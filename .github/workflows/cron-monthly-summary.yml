name: Cron — monthly summary (รายเดือน)

# แทน Vercel cron เดิม ("0 2 1 * *" ใน vercel.json) หลังย้าย host ไป Netlify
# สรุปรายเดือนวันที่ 1 ของเดือน
# endpoint ป้องกันด้วย Authorization: Bearer ${CRON_SECRET}
on:
  schedule:
    - cron: "0 2 1 * *" # 02:00 UTC วันที่ 1 = 09:00 ไทย
  workflow_dispatch: {} # กดรันเองได้จากแท็บ Actions

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hit monthly-summary cron
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.chao-dee.com/api/cron/monthly-summary)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "cron failed"; exit 1; }
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
